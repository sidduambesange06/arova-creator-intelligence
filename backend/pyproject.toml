[project]
name = "arova-creator-intelligence"
version = "0.1.0"
description = "Local-first video indexing, two-stage hybrid RAG, and MCP engine for AI agents and developers."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "imageio-ffmpeg>=0.5.1",
    "mcp>=2.3.0",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.0.0",
]
ai = [
    "sentence-transformers>=3.0.0",
]
cloud = [
    "google-genai>=0.1.0",
]
all = [
    "faster-whisper>=1.0.0",
    "sentence-transformers>=3.0.0",
    "google-genai>=0.1.0",
]

[project.scripts]
arova = "app.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

