services:
  arova-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arova-creator-intelligence
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - SQLITE_DB_PATH=/app/data/app.db
      - CHROMA_PERSIST_DIR=/app/data/vectors
      - MEDIA_STORAGE_DIR=/app/data/media
      - ALLOWED_MEDIA_ROOTS=/app/data/media,/app/media
    volumes:
      - ./data:/app/data
      - ./media:/app/media:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

