name: CI Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Pytest & MCP Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install locked dependencies
        run: uv sync --project backend --group dev --locked

      - name: Run Backend & MCP Tests
        run: PYTHONPATH=backend:. uv run --project backend --no-sync pytest backend/tests mcp_server/tests -v --tb=short

  frontend-tests:
    name: Frontend Vitest & TypeScript Build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npm test

      - name: Build Production SPA Bundle
        working-directory: frontend
        run: npm run build

  system-health-audit:
    name: System Health & Security Audit
    runs-on: ubuntu-24.04
    needs: [backend-tests, frontend-tests]
    if: always()
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install locked dependencies
        run: |
          uv sync --project backend --group dev --locked
          cd frontend && npm ci

      - name: Run Master System Health Audit
        run: PYTHONPATH=backend:. uv run --project backend --no-sync python scripts/system_health_audit.py
