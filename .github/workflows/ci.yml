name: CI Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Pytest & MCP Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system -r backend/pyproject.toml --group dev
          pip install --no-deps -e . || true

      - name: Run Backend & MCP Tests
        run: |
          PYTHONPATH="backend:." pytest backend/tests mcp_server/tests -v --tb=short

  frontend-tests:
    name: Frontend Vitest & TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npm test

      - name: Build Production SPA Bundle
        working-directory: frontend
        run: npm run build

  system-health-audit:
    name: System Health & Security Audit
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          pip install -r backend/pyproject.toml || pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy alembic imageio-ffmpeg mcp pytest httpx
          cd frontend && npm ci && cd ..

      - name: Run Master System Health Audit
        run: |
          PYTHONPATH="backend:." python scripts/system_health_audit.py
